<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crown icon -->
  <g transform="translate(20, 30)" filter="url(#glow)">
    <path d="M5 55 L15 15 L30 35 L45 5 L60 35 L75 15 L85 55 Z"
          fill="url(#gold)" stroke="url(#gold)" stroke-width="2" stroke-linejoin="round"/>
    <rect x="5" y="55" width="80" height="10" fill="url(#gold)" rx="2"/>
    <circle cx="15" cy="15" r="4" fill="#FFD700"/>
    <circle cx="45" cy="5"  r="4" fill="#FFD700"/>
    <circle cx="75" cy="15" r="4" fill="#FFD700"/>
  </g>

  <!-- Wordmark -->
  <text x="125" y="92"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="68"
        font-weight="900"
        letter-spacing="6"
        fill="url(#gold)">INFLUENCE</text>
</svg>
