<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Bodoni Moda';
    src: url('./fonts/BodoniModa.ttf') format('truetype');
    font-weight: 400 900;
    font-style: normal;
  }
  @font-face {
    font-family: 'Bodoni Moda';
    src: url('./fonts/BodoniModa-Italic.ttf') format('truetype');
    font-weight: 400 900;
    font-style: italic;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  .feed {
    width: 1080px;
    height: 1350px;
    background: #000;
    color: #f4efe6;
    font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
    padding: 56px 52px 48px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 32px;
    align-items: stretch;
  }
  .brand {
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.4em;
    color: #c9a96e;
    padding-right: 0.4em;
  }
  .eyebrow {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #c9a96e;
  }
  .weekday {
    margin-top: 34px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #c9a96e;
  }
  .day {
    margin-top: 8px;
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-weight: 600;
    font-size: 72px;
    line-height: 0.94;
    letter-spacing: -0.02em;
  }
  .time {
    margin-top: 12px;
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-size: 26px;
    color: rgba(244,239,230,0.78);
  }
  .venue { margin-top: 28px; font-size: 24px; font-weight: 700; }
  .addr { margin-top: 6px; font-size: 18px; color: rgba(244,239,230,0.72); }
  .host {
    margin-top: 18px;
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-style: italic;
    font-size: 24px;
    color: #c9a96e;
  }
  .hero-photo {
    overflow: hidden;
    border: 1px solid rgba(201,169,110,0.45);
    background: #0a0908;
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 18%;
  }

  .roster {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .roster figure {
    margin: 0;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border: 1px solid rgba(201,169,110,0.3);
    background: #0a0908;
  }
  .roster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
  }

  .bottom {
    margin-top: auto;
    padding-top: 28px;
    border-top: 1px solid rgba(201,169,110,0.4);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;
  }
  .price {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    border: 1px solid rgba(201,169,110,0.75);
  }
  .price .col { padding: 20px 14px; text-align: center; }
  .price .label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c9a96e;
  }
  .price .value {
    margin-top: 8px;
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-weight: 600;
    font-size: 48px;
    line-height: 1;
  }
  .price .value.gold { color: #c9a96e; }
  .price .divider { background: rgba(201,169,110,0.5); }
  .url {
    margin-top: 14px;
    font-size: 16px;
    color: rgba(244,239,230,0.68);
  }
  .qr-wrap { text-align: center; }
  .qr-wrap .scan {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c9a96e;
    margin-bottom: 8px;
  }
  .qr {
    width: 148px;
    height: 148px;
    background: #fff;
    padding: 8px;
  }
  .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="feed">
    <div class="top">
      <div>
        <div class="brand">INFLUENCE</div>
        <div class="eyebrow">Influence Connect</div>
        <div class="weekday">Wednesday</div>
        <div class="day">December 16</div>
        <div class="time">2026 · 4–7 PM ET</div>
        <div class="venue">Serena Pastificio</div>
        <div class="addr">Mizner Park · Boca Raton</div>
        <div class="host">Hosted by Deseray Marie</div>
      </div>
      <div class="hero-photo">
        <img src="./img/des-hero.webp" alt="" />
      </div>
    </div>

    <div class="roster">
      <figure><img src="./img/amb-genesis.webp" alt="" /></figure>
      <figure><img src="./img/amb-kat.webp" alt="" /></figure>
      <figure><img src="./img/amb-alisha.webp" alt="" /></figure>
      <figure><img src="./img/seahra-gold-lg.webp" alt="" /></figure>
    </div>

    <div class="bottom">
      <div>
        <div class="price">
          <div class="col">
            <div class="label">Business Owners</div>
            <div class="value gold">$75</div>
          </div>
          <div class="divider"></div>
          <div class="col">
            <div class="label">Ladies &amp; Ambassadors</div>
            <div class="value">Free</div>
          </div>
        </div>
        <div class="url">influencecreators.marketing/dec16</div>
      </div>
      <div class="qr-wrap">
        <div class="scan">Scan for tickets</div>
        <div class="qr">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;margin=0&amp;data=https%3A%2F%2Finfluencecreators.marketing%2Fdec16" alt="" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
