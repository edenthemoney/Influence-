<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bodoni Moda'; src: url('./fonts/BodoniModa.ttf') format('truetype'); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: 'Bodoni Moda'; src: url('./fonts/BodoniModa-Italic.ttf') format('truetype'); font-weight: 400 900; font-style: italic; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
  .feed {
    width: 1080px; height: 1350px; background: #000; color: #f4efe6;
    font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
    padding: 52px 48px 44px; display: flex; flex-direction: column;
  }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch; min-height: 620px; }
  .brand { font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 600; font-size: 26px; letter-spacing: 0.4em; color: #c9a96e; padding-right: 0.4em; }
  .eyebrow { margin-top: 28px; font-size: 14px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #c9a96e; }
  .headline { margin-top: 18px; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 600; font-size: 48px; line-height: 1.08; }
  .headline .gold { color: #c9a96e; }
  .details { margin-top: 22px; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .place { margin-top: 10px; font-size: 17px; color: rgba(244,239,230,0.8); }
  .host { margin-top: 16px; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-style: italic; font-size: 22px; color: #c9a96e; }
  .portrait { overflow: hidden; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 14%; }
  .strip { margin-top: 22px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .strip figure { margin: 0; aspect-ratio: 3/4; overflow: hidden; border: 1px solid rgba(201,169,110,0.28); background: #0a0908; }
  .strip img { width: 100%; height: 100%; object-fit: cover; }
  .strip .face img { object-position: center 14%; }
  .strip .place-shot img { object-position: center 42%; }
  .strip .drink img { object-position: center 40%; }
  .bottom { margin-top: auto; padding-top: 22px; border-top: 1px solid rgba(201,169,110,0.35); display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; }
  .price { display: grid; grid-template-columns: 1fr 1px 1fr; border: 1px solid rgba(201,169,110,0.75); }
  .price .col { padding: 18px 12px; text-align: center; }
  .price .label { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #c9a96e; }
  .price .value { margin-top: 6px; font-family: 'Bodoni Moda', Didot, Georgia, serif; font-weight: 600; font-size: 42px; line-height: 1; }
  .price .divider { background: rgba(201,169,110,0.5); }
  .url { margin-top: 12px; font-size: 15px; color: rgba(244,239,230,0.65); }
  .qr-wrap { text-align: center; }
  .qr-wrap .scan { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #c9a96e; margin-bottom: 6px; }
  .qr { width: 124px; height: 124px; background: #fff; padding: 6px; }
  .qr img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="feed">
    <div class="top">
      <div>
        <div class="brand">INFLUENCE</div>
        <div class="eyebrow">Influence Connect</div>
        <div class="headline">Meet the Right <span class="gold">Brand Ambassadors</span> for Your Business</div>
        <div class="details">Wed · Dec 16 · 4–7 PM</div>
        <div class="place">Serena Pastificio / Mizner Park, Boca Raton</div>
        <div class="host">Hosted by Deseray Marie</div>
      </div>
      <div class="portrait"><img src="./img/des-hero.webp" alt="" /></div>
    </div>
    <div class="strip">
      <figure class="face"><img src="./img/amb-genesis.webp" alt="" /></figure>
      <figure class="face"><img src="./img/amb-kat.webp" alt="" /></figure>
      <figure class="place-shot"><img src="./img/patio-hero.webp" alt="" /></figure>
      <figure class="drink"><img src="./img/venue-martini.webp" alt="" /></figure>
      <figure class="face"><img src="./img/amb-alisha.webp" alt="" /></figure>
    </div>
    <div class="bottom">
      <div>
        <div class="price">
          <div class="col"><div class="label">Business Owners</div><div class="value">$75</div></div>
          <div class="divider"></div>
          <div class="col"><div class="label">Ladies &amp; Ambassadors</div><div class="value">RSVP Free</div></div>
        </div>
        <div class="url">influencecreators.marketing/dec16</div>
      </div>
      <div class="qr-wrap">
        <div class="scan">Scan for tickets</div>
        <div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;margin=0&amp;data=https%3A%2F%2Finfluencecreators.marketing%2Fdec16" alt="" /></div>
      </div>
    </div>
  </div>
</body>
</html>
